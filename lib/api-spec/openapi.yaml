openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /backup:
    get:
      operationId: getBackupOverview
      summary: View authorized backup status and recoverable records
      responses:
        "200":
          description: Role-scoped recovery overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupOverview"
  /backup/database:
    post:
      operationId: createDatabaseBackup
      summary: Administrator creates an encrypted full database backup
      responses:
        "201":
          description: Backup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFile"
  /backup/snapshot:
    post:
      operationId: createPersonalSnapshot
      summary: Save an encrypted snapshot of the signed-in user's records
      responses:
        "201":
          description: Snapshot completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupFile"
  /backup/restore:
    post:
      operationId: restoreBackupRecord
      summary: Restore a deleted record or missing personal snapshot records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      summary: Send or resend an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "202":
          description: Request processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        "429":
          description: Too many requests
        "503":
          description: Email provider unavailable
  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Verify a single-use email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationConfirmation"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        "400":
          description: Invalid, expired, or exhausted code
        "429":
          description: Too many attempts
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    BackupFile:
      type: object
      required: [id, createdAt, bytes]
      properties:
        id: { type: string }
        createdAt: { type: string }
        bytes: { type: number }
    RecoveryInput:
      type: object
      required: [action, id]
      properties:
        action: { type: string, enum: [record, snapshot] }
        id: { type: string, format: uuid }
        kind: { type: string, enum: [scans, reports, feedback, users] }
    RecoveryResult:
      type: object
      required: [restored, message]
      properties:
        restored: { type: number }
        message: { type: string }
    DeletedRecord:
      type: object
      required: [kind, id, title, deletedAt]
      properties:
        kind: { type: string, enum: [scans, reports, feedback, users] }
        id: { type: string }
        title: { type: string }
        deletedAt: { type: string }
    BackupOverview:
      type: object
      required: [role, enabled, ready, message, scheduleHours, retentionDays, databaseBackups, snapshots, deleted]
      properties:
        role: { type: string, enum: [user, admin] }
        enabled: { type: boolean }
        ready: { type: boolean }
        message: { type: string }
        scheduleHours: { type: number }
        retentionDays: { type: number }
        databaseBackups:
          type: array
          items: { $ref: "#/components/schemas/BackupFile" }
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/BackupFile" }
        deleted:
          type: array
          items: { $ref: "#/components/schemas/DeletedRecord" }
    EmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 200
    EmailVerificationConfirmation:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 200
        code:
          type: string
          pattern: '^\d{6}$'
    VerificationStatus:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

